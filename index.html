<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <title>Rubik's Cube</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <section class="stage" id="stage">
        <canvas id="scene"></canvas>

        <header id="hud">
          <div class="counter" id="counter">
            <span class="counter-label">手数</span>
            <span class="counter-value" id="moves">0</span>
          </div>
          <div class="status" id="status"></div>
        </header>

        <footer id="controls">
          <button class="icon-btn" id="undo" type="button" aria-label="アンドゥ">↶</button>
          <button class="round-btn hold-btn" id="shuffle" type="button" aria-label="シャッフル">
            <svg class="hold-ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="46"></circle>
            </svg>
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5"></path>
              <path d="M4 20l16.5 -16.5"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M15 15l6 6"></path>
              <path d="M4 4l5 5"></path>
            </svg>
          </button>
          <button class="round-btn hold-btn" id="reset" type="button" aria-label="リセット">
            <svg class="hold-ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="46"></circle>
            </svg>
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9 -9"></path>
              <path d="M3 4v5h5"></path>
            </svg>
          </button>
          <button class="icon-btn" id="redo" type="button" aria-label="リドゥ">↷</button>
        </footer>

        <div class="edge-hint left" id="undo-edge" aria-hidden="true"></div>
        <div class="edge-hint right" id="redo-edge" aria-hidden="true"></div>
      </section>
    </div>

    <div id="tutorial" hidden>
      <div class="tut-card">
        <h2>あそびかた</h2>
        <ul>
          <li><b>面をなぞる</b> — 指に追従して面が回り、離すと90°にスナップ</li>
          <li><b>余白をドラッグ</b> — キューブ全体を回して視点変更</li>
          <li><b>2本指</b> — でも視点変更できます</li>
          <li><b>ダブルタップ</b> — 最寄りの面の正面へ（画面の隅なら頂点ビューへ）</li>
          <li><b>画面の左/右端からスワイプ</b> — アンドゥ/リドゥ</li>
        </ul>
        <button class="btn tut-close" id="tut-close" type="button">はじめる</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
