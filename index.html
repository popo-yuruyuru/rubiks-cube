<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <title>Rubik's Cube</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header id="hud">
      <div class="counter" id="counter">
        <span class="counter-label">手数</span>
        <span class="counter-value" id="moves">0</span>
      </div>
      <div class="status" id="status"></div>
    </header>

    <footer id="controls">
      <button class="btn" id="shuffle" type="button">シャッフル</button>
      <button class="btn" id="reset" type="button">リセット</button>
    </footer>

    <div id="tutorial" hidden>
      <div class="tut-card">
        <h2>あそびかた</h2>
        <ul>
          <li><b>面をなぞる</b> — 指に追従して面が回り、離すと90°にスナップ</li>
          <li><b>余白をドラッグ</b> — キューブ全体を回して視点変更</li>
          <li><b>2本指</b> — でも視点変更できます</li>
          <li><b>ダブルタップ</b> — 正面ビューに戻す</li>
        </ul>
        <button class="btn tut-close" id="tut-close" type="button">はじめる</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
